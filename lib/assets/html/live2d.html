<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria Echo Live2D</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
    }

    #live2d-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="live2d-container"></div>

  <script>
    // 接收来自Flutter的消息
    function receiveMsgFromFlutter(message) {
      try {
        const {action, data} = JSON.parse(message);

        switch(action) {
          case 'speak':
            // 触发说话动画
            console.log('Live2D说话:', data);
            break;
          case 'expression':
            // 切换表情
            console.log('切换表情:', data);
            break;
        }
      } catch (e) {
        console.error('处理消息错误:', e);
      }
    }

    // 向Flutter发送消息
    function sendMessageToFlutter(message) {
      if (window.FlutterApp) {
        window.FlutterApp.postMessage(JSON.stringify(message));
      }
    }
  </script>

  <!-- 这里需要添加加载原始项目Live2D库的脚本 -->
  <!-- 加载Live2D库 -->
  <script src="./live2d/core/live2dcubismcore.min.js"></script>
  <script src="./live2d/framework/live2dcubismframework.js"></script>
  <script src="./live2d/framework/effect/cubismbreath.js"></script>
  <script src="./live2d/framework/effect/cubismeyeblink.js"></script>
  <script src="./live2d/framework/motion/cubismmotionmanager.js"></script>
  <script src="./live2d/framework/physics/cubismphysics.js"></script>
  <script src="./live2d/framework/rendering/cubismrenderer.js"></script>
  <script src="./live2d/framework/cubismdefaultparameterid.js"></script>
  <script src="./live2d/framework/math/cubismmodelmatrix.js"></script>
<!--  <script src="./live2d/framework/cubismmodelmatrixer.js"></script>-->
<!--  <script src="./live2d/framework/cubismmodelviewmatrix.js"></script>-->

  <!-- 加载模型管理和应用初始化脚本 -->
  <script src="./live2d/src/model.js"></script>
  <script src="./live2d/src/main.js"></script>

  <script>
    // 初始化Live2D模型
    window.onload = async function() {
      // 模型路径配置
      const modelPath = './live2d/models/模型名称';

      try {
        await initializeLive2DModel(modelPath);
        console.log('Live2D模型加载成功');

        // 通知Flutter模型加载完成
        sendMessageToFlutter({
          action: 'modelLoaded',
          success: true
        });
      } catch (error) {
        console.error('Live2D模型加载失败:', error);
        sendMessageToFlutter({
          action: 'modelLoaded',
          success: false,
          error: error.message
        });
      }
    };
  </script>
</body>
</html>
