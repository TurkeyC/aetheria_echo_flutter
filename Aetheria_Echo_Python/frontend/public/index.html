<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>Aetheria Echo - 虚拟助手</title>
  <meta name="description" content="基于Live2D的多模态AI虚拟助手">
  
  <!-- 加载Cubism库 -->
  <script src="<%= BASE_URL %>lib/live2d.min.js"></script>
  <script src="<%= BASE_URL %>lib/live2dcubismcore.min.js"></script>
  
  <!-- 库初始化脚本 -->
  <script>
    // 手动定义Live2DPlatformManager和Live2DCaptureCanvas以避免错误
    function Live2DPlatformManager() {}
    function Live2DCaptureCanvas() {}
    
    // 添加页面加载诊断信息
    window.addEventListener('DOMContentLoaded', function() {
      console.log('文档加载完成, 检查Cubism库状态:');
      console.log('- Cubism 2:', window.Live2D ? '已加载' : '未加载');
      console.log('- Cubism 4:', window.Live2DCubismCore ? '已加载' : '未加载');
      
      // 尝试手动初始化Cubism 2
      if (window.Live2D && typeof window.Live2D.init === 'function') {
        try {
          window.Live2D.init();
          console.log('Cubism 2 初始化成功!');
        } catch(e) {
          console.error('Cubism 2 初始化失败:', e);
          
          // 如果初始化失败，尝试添加一个备用的Live2D初始化
          window.Live2D = window.Live2D || {};
          if (!window.Live2DPlatformManager) {
            window.Live2DPlatformManager = function() {};
          }
          if (!window.Live2DCaptureCanvas) {
            window.Live2DCaptureCanvas = function() {};
          }
          
          console.log('已添加备用Live2D初始化');
        }
      }
    });
  </script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f5f7fa;
      overflow-x: hidden;
    }
    
    /* 添加调试面板样式 */
    .debug-panel {
      position: fixed;
      bottom: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      font-size: 12px;
      z-index: 9999;
      max-width: 300px;
      max-height: 200px;
      overflow: auto;
    }
    .debug-panel.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <noscript>
    <strong>很抱歉，Aetheria Echo需要JavaScript才能运行。请启用它继续。</strong>
  </noscript>
  <div id="app"></div>
  
  <!-- 添加调试面板 -->
  <div class="debug-panel" id="debug-panel">
    <h4>调试信息</h4>
    <div id="debug-content">页面加载中...</div>
    <button onclick="document.getElementById('debug-panel').classList.toggle('hidden')">隐藏</button>
  </div>
  
  <script>
    // 将console.log输出也显示在调试面板中
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    const debugContent = document.getElementById('debug-content');
    
    console.log = function() {
      originalLog.apply(console, arguments);
      const args = Array.from(arguments).join(' ');
      debugContent.innerHTML += `<div style="color:#8F8">LOG: ${args}</div>`;
    };
    
    console.error = function() {
      originalError.apply(console, arguments);
      const args = Array.from(arguments).join(' ');
      debugContent.innerHTML += `<div style="color:#F88">ERROR: ${args}</div>`;
    };
    
    console.warn = function() {
      originalWarn.apply(console, arguments);
      const args = Array.from(arguments).join(' ');
      debugContent.innerHTML += `<div style="color:#FF8">WARN: ${args}</div>`;
    };
  </script>
</body>
</html>
